name: CI

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore src/Base45.sln

      - name: Build
        run: dotnet build src/Base45.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test src/Base45.sln --configuration Release --no-build --verbosity normal

  publish:
    # Only when a version tag (e.g. v1.6.0) is pushed, and only if tests passed.
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Pack
        # Package version is taken from <PackageVersion> in Base45Utility.csproj.
        run: >-
          dotnet pack src/Base45Utility/Base45Utility.csproj
          --configuration Release
          --output ${{ github.workspace }}/artifacts

      - name: Push to GitHub Packages
        run: >-
          dotnet nuget push "${{ github.workspace }}/artifacts/*.nupkg"
          --api-key ${{ secrets.GITHUB_TOKEN }}
          --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
          --skip-duplicate
